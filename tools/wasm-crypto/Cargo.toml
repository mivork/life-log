[package]
name = "lifelog-wasm-crypto"
version = "0.1.0"
edition = "2021"
description = "LifeLog browser-side record validation and passphrase-based local encryption (Phase 4, Rust/WASM)"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# 暗号: AES-256-GCM（認証付き暗号）+ Argon2id によるパスフレーズ鍵導出。
# XOR のような玩具実装は使わない。
aes-gcm = "0.10"
argon2 = "0.5"
base64 = "0.22"

# getrandom の js バックエンドは wasm32 でのみ有効化する。
# ネイティブ (cargo test 等) では OS の乱数源を使うため、ここで js を有効化すると実行時に abort する。
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

[profile.release]
opt-level = "s"
lto = true
